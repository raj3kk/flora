name: Flora Release Build
# CEO batch 2026-10-31, D-02 (a) CI signing + D-01 Releases channel.
# workflow_dispatch ONLY — har push par release-signing nahi chalegi.
# Secrets (GitHub Actions secrets, sealed-box, kabhi repo me nahi):
#   FLORA_RELEASE_KEYSTORE_B64 — keystore ka base64 form
#   FLORA_RELEASE_KEYSTORE_PASSWORD — keystore password (single value;
#     build.gradle.kts isi ko storePassword + keyPassword dono banata hai)
# Workflow in secrets ko $HOME/workspace/secure/ me likhta hai (wahi path
# jo app/build.gradle.kts padhta hai), 600 perms, phir assembleRelease.
# Tag: release-build-<run_number> (debug workflow ke debug-build- se alag).
# Prerelease: YES jab tak user ka phone sign-off (D-26) nahi milta — asset
# download/verify tab bhi ho jayega, "stable release" ka daava pehle nahi.
on:
  workflow_dispatch:
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Restore release signing files from secrets
        env:
          FLORA_RELEASE_KEYSTORE_B64: ${{ secrets.FLORA_RELEASE_KEYSTORE_B64 }}
          FLORA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.FLORA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$HOME/workspace/secure"
          printf '%s' "$FLORA_RELEASE_KEYSTORE_B64" | base64 -d > "$HOME/workspace/secure/flora-release.keystore"
          printf '%s' "$FLORA_RELEASE_KEYSTORE_PASSWORD" > "$HOME/workspace/secure/flora-release-keystore.pwd"
          chmod 600 "$HOME/workspace/secure/flora-release.keystore" "$HOME/workspace/secure/flora-release-keystore.pwd"
      - name: Build release APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: :app:assembleRelease
      - name: Publish release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="release-build-${{ github.run_number }}"
          gh release create "$TAG" --prerelease --title "Flora release build ${{ github.run_number }}" --notes "Commit ${{ github.sha }} — prerelease until user phone sign-off (D-26)" app/build/outputs/apk/release/*.apk
