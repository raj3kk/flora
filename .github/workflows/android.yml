name: Flora Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: :app:assembleDebug
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-build-${{ github.run_number }}"
          gh release create "$TAG" --prerelease --title "Flora debug build ${{ github.run_number }}" --notes "Commit ${{ github.sha }}" app/build/outputs/apk/debug/*.apk
      - name: Run unit tests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: :app:testDebugUnitTest
      - name: Self-map drift check
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: :app:testDebugUnitTest --tests "com.flora.app.planner.SelfMapDriftCheckTest"
