name: Flora Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: :app:assembleDebug
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-build-${{ github.run_number }}"
          gh release create "$TAG" --prerelease --title "Flora debug build ${{ github.run_number }}" --notes "Commit ${{ github.sha }}" app/build/outputs/apk/debug/*.apk
      - name: Run unit tests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: :app:testDebugUnitTest
      - name: Self-map drift check
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: :app:testDebugUnitTest --tests "com.flora.app.planner.SelfMapDriftCheckTest"
  # CEO batch 2026-10-31 — CI test-job (Part 2 workflow, content Part 1 tests).
  # Maujooda build job ko chheda nahi gaya hai; ye alag job uske saath chalti hai.
  # Build job me pehle se poora :app:testDebugUnitTest step hai; ye job
  # CatcherEventsTest + WatchlistStoreTest ka focused gate hai.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Run Part 1 focused unit tests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: :app:testDebugUnitTest --tests "com.flora.app.data.CatcherEventsTest" --tests "com.flora.app.data.WatchlistStoreTest"
