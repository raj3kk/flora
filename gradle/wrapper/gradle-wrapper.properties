# Gradle 8.7 — local distribution already exists at ~/.gradle-dist/gradle-8.7.
# NOTE: do NOT copy any existing gradle.properties that contains credentials
# into this project. Proxy (if needed) must come from the environment, never
# from a file committed here. No secrets are stored in this project.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
